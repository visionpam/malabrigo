<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#031522" />
    <title>Sin conexión | Malabrigo Club Resort</title>
    <style>
      *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;color:#f7f5ee;background:radial-gradient(circle at 50% 0,rgba(33,138,176,.22),transparent 42%),#031522;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(440px,100%);padding:32px;text-align:center;border:1px solid rgba(214,163,66,.38);border-radius:22px;background:#082b43;box-shadow:0 28px 80px rgba(0,0,0,.36)}img{width:112px;height:112px;border-radius:22px}h1{margin:24px 0 10px;font-size:30px;line-height:1.15}p{margin:0;color:#bed0d7;font-size:16px;line-height:1.6}button{min-height:48px;margin-top:24px;padding:0 22px;color:#071925;border:0;border-radius:12px;background:#f0c56f;font:700 15px system-ui;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:3px}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="Malabrigo Club Resort" />
      <h1>Sin conexión</h1>
      <p>No pudimos conectarnos en este momento. Tus datos permanecen protegidos; vuelve a intentarlo cuando recuperes la conexión.</p>
      <button type="button" onclick="location.reload()">Intentar nuevamente</button>
    </main>
  </body>
</html>
